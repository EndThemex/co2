  :root{
    --bg:#070a0f;
    --panel:#0d121a;
    --panel-2:#111823;
    --line:#1e2836;
    --line-2:#2a3648;
    --txt:#d9e2ee;
    --dim:#7b8899;
    --dim-2:#5b6878;
    --accent:#5ad7ff;
    --ok:#5ce68a;
    --warn:#ffb454;
    --bad:#ff5d73;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
    --sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1200px 600px at 22% -10%,#0e1a26 0%,transparent 60%),
      var(--bg);
    color:var(--txt);font-family:var(--sans);font-size:13px;
  }
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:14px 20px;border-bottom:1px solid var(--line);
    background:rgba(9,13,19,.82);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:10;
  }
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0}
  .brand h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px;white-space:nowrap}
  .brand .sub{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .led{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none;align-self:center}
  .top-actions{display:flex;align-items:center;gap:10px;flex:none}
  .mini{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;white-space:nowrap}
  select,input[type=number],input[type=text]{
    background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;
    color:var(--txt);padding:5px 7px;outline:none;font-family:var(--mono);font-size:12px;
  }
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(90,215,255,.14)}
  .btn{
    background:linear-gradient(#182334,#121a26);border:1px solid var(--line-2);border-radius:7px;
    color:var(--txt);padding:6px 11px;font-size:12px;transition:.15s;
  }
  .btn:hover{border-color:#3b506a;background:#172230}
  .btn.ghost{background:transparent}
  .app{
    display:grid;grid-template-columns:258px minmax(0,1fr) 304px;
    gap:14px;padding:14px 16px 22px;align-items:start;
    max-width:1800px;margin:0 auto;
  }
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;min-width:0;position:sticky;top:70px;
    max-height:calc(100vh - 84px);overflow:auto;
  }
  .panel-title{
    font-size:11px;letter-spacing:1.4px;color:var(--dim-2);text-transform:uppercase;
    margin:14px 0 8px;display:flex;align-items:center;justify-content:space-between;
  }
  .panel-title:first-child{margin-top:0}
  .tabs{display:flex;gap:6px}
  .tab{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 6px;color:var(--dim);font-size:12px;text-align:center;transition:.15s;
  }
  .tab:hover{color:var(--txt);border-color:var(--line-2)}
  .tab.active{color:#051018;background:linear-gradient(180deg,#78e6ff,#3fbfe0);border-color:#78e6ff;font-weight:600}
  .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{display:flex;flex-direction:column;gap:3px;min-width:0}
  .field label{font-size:11px;color:var(--dim)}
  .field input,.field select{width:100%}
  .field.wide{grid-column:1 / -1}
  .quick{display:flex;gap:6px;margin-top:8px}
  .quick .btn{flex:1;padding:6px 4px}
  .layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .layer{
    display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;
    border:1px solid transparent;cursor:pointer;min-width:0;
  }
  .layer:hover{background:#111a26;border-color:var(--line)}
  .layer.sel{background:#122130;border-color:#2e5a74}
  .layer .dot{width:7px;height:7px;border-radius:2px;flex:none}
  .layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .layer .pos{font-family:var(--mono);font-size:10px;color:var(--dim-2);flex:none}
  .layer .eye{border:0;background:none;color:var(--dim-2);padding:1px 3px;font-size:12px;line-height:1}
  .layer .eye:hover{color:var(--txt)}
  .layer.hidden .nm{opacity:.42;text-decoration:line-through}
  .stage{min-width:0;display:flex;flex-direction:column;gap:12px}
  .stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tg{
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:5px 9px;font-size:11px;user-select:none;
  }
  .tg:hover{border-color:var(--line-2);color:var(--txt)}
  .tg.on{color:var(--accent);border-color:#2c5368;background:#0c1a24}
  .spacer{flex:1}
  .zoom{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
  .zoom button{
    width:24px;height:24px;border-radius:6px;border:1px solid var(--line-2);
    background:var(--panel);color:var(--txt);line-height:1;
  }
  .zoom button:hover{border-color:#3b506a}
  #zoomLabel{font-family:var(--mono);min-width:26px;text-align:center;color:var(--txt)}
  .stage-scroll{overflow:auto;padding:16px 12px 12px;border-radius:12px;border:1px solid var(--line);background:#080c12}
  .screen-grid{
    display:grid;grid-template-columns:26px auto;grid-template-rows:18px auto;
    gap:6px;width:max-content;margin:0 auto;
  }
  .corner{grid-column:1;grid-row:1;display:flex;align-items:flex-end;justify-content:flex-end;color:var(--dim-2);font-family:var(--mono);font-size:9px;padding-right:2px}
  .ruler-x{grid-column:2;grid-row:1;position:relative;height:18px;overflow:hidden}
  .ruler-y{grid-column:1;grid-row:2;position:relative;width:26px;overflow:hidden}
  .ruler-x .tick{position:absolute;top:8px;height:5px;border-left:1px solid #2b394d;color:var(--dim-2);font:9px/1 var(--mono);padding-left:2px;white-space:nowrap}
  .ruler-x .tick.major{top:2px;height:11px;color:var(--dim)}

  let w = 0;
  for (const ch of text) {
    if (ch.codePointAt(0) < 0x100) w += measureCtx.measureText(ch).width;
  }
  return w;
}

function ttfPixels(text, f, x, y){
  const w = Math.max(1, Math.ceil(ttfWidth(text, f)));
  const pad = 2;
  const cv = document.createElement("canvas");
  cv.width = w + pad * 2;
  cv.height = f.size + pad * 2;
  const c = cv.getContext("2d");
  c.font = ttfFontString(f);
  c.textBaseline = "top";
  c.fillStyle = "#fff";
  let cx = pad;
  for (const ch of text) {
    if (ch.codePointAt(0) >= 0x100) continue; // these TTF faces have no CJK glyphs
    c.fillText(ch, cx, pad);
    cx += c.measureText(ch).width;
  }
  const data = c.getImageData(0, 0, cv.width, cv.height).data;
  const out = [];
  for (let py = 0; py < cv.height; py++) {
    for (let px = 0; px < cv.width; px++) {
      if (data[(py * cv.width + px) * 4 + 3] > 128)
        out.push(x + px - pad, y + py - pad);
    }
  }
  return out;
}

function measure(text, fontKey, metric){
  const f = resolveFont(fontKey, metric);
  if (f.kind === "ttf") return Math.round(ttfWidth(text, f));
  let w = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    w += cp < 0x100 ? 6 * f.ax : 13 * f.cjk;
  }
  return w;
}

function textHeight(text, fontKey, metric){
  const f = resolveFont(fontKey, metric);
  if (f.kind === "ttf") return f.size;
  let h = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    h = Math.max(h, cp < 0x100 ? 8 * f.ay : 12 * f.cjk);
  }
  return h || 8;
}

function elX(el){
  const w = measure(el.text, el.font, state.metric);
  if (el.align === "center") return Math.floor(el.anchor - w / 2);
  if (el.align === "right") return el.anchor - w;
  return el.anchor;
}

function geom(el){
  const w = measure(el.text, el.font, state.metric);
  return { x: elX(el), y: el.y, w, h: textHeight(el.text, el.font, state.metric) };
}

function glyphPixels(el){
  const f = fontOf(el);
  if (f.kind === "ttf") return ttfPixels(el.text, f, elX(el), el.y);
  const out = [];
  let cx = elX(el);
  for (const ch of el.text) {
    const cp = ch.codePointAt(0);
    if (cp < 0x100) {
      const g = (cp === 0xB0 || cp === 0xF8) ? DEGREE : (FONT5X7[cp] || FONT5X7[32]);
      if (!g) { cx += 6 * f.ax; continue; }
      for (let col = 0; col < 5; col++) {
        const bits = g[col];
        for (let row = 0; row < 7; row++) {
          if (bits & (1 << row)) {
            for (let dy = 0; dy < f.ay; dy++)
              for (let dx = 0; dx < f.ax; dx++)
                out.push(cx + col * f.ax + dx, el.y + row * f.ay + dy);
          }
        }
      }
      cx += 6 * f.ax;
    } else {
      const g = CJK[cp];
      const s = f.cjk;
      if (g) {
        for (let row = 0; row < 12; row++) {
          const b0 = g[row * 2], b1 = g[row * 2 + 1];
          for (let col = 0; col < 12; col++) {
            const byte = col < 8 ? b0 : b1;
            if (byte & (0x80 >> (col % 8))) {
              for (let dy = 0; dy < s; dy++)
                for (let dx = 0; dx < s; dx++)
                  out.push(cx + col * s + dx, el.y + row * s + dy);
            }
          }
        }
      }
      cx += 13 * s;
    }
  }
  return out;
}

// ---- Data binding ---------------------------------------------------------
function comfortWord(t, h){
  if (t < 18) return "偏冷";
  if (t > 28) return "偏热";
  if (h < 30) return "干燥";
  if (h > 70) return "潮湿";
  if (t >= 20 && t <= 26 && h >= 40 && h <= 60) return "舒适";
  return "正常";
}
function aqiWord(a){
  switch (a) {
    case 1: return "优";
    case 2: return "良";
    case 3: return "中";
    case 4: return "差";
    case 5: return "很差";
    default: return "未知";
  }
}
function syncTexts(){
  const d = state.data;
  for (const el of state.elements) {
    switch (el.bind) {
      case "temp": el.text = d.t.toFixed(1); break;
      case "hum": el.text = String(Math.round(d.h)); break;
      case "comfort": el.text = comfortWord(d.t, d.h); break;
      case "eco2": el.text = String(Math.round(d.eco2)); break;
      case "tvoc": el.text = String(Math.round(d.tvoc)); break;
      case "aqiDigit": el.text = (d.aqi >= 1 && d.aqi <= 5) ? String(Math.round(d.aqi)) : "-"; break;
      case "aqiWord": el.text = aqiWord(Math.round(d.aqi)); break;
    }
  }
}

// ---- Screen rendering -----------------------------------------------------
function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return { r:(n >> 16) & 255, g:(n >> 8) & 255, b:n & 255 };
}

function drawScreen(){
  const img = sctx.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < W * H; i++) { d[i*4] = 0; d[i*4+1] = 0; d[i*4+2] = 0; d[i*4+3] = 255; }

  for (const el of state.elements) {
    if (el.visible === false || !el.text) continue;
    const col = state.toggles.colors ? hexToRgb(COLORS[el.role] || "#ffffff") : { r:255,g:255,b:255 };
    const px = glyphPixels(el);
    for (let i = 0; i < px.length; i += 2) {
      const x = px[i], y = px[i+1];
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const o = (y * W + x) * 4;
      d[o] = col.r; d[o+1] = col.g; d[o+2] = col.b; d[o+3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);
}

function drawOverlay(){
  const z = state.zoom;
  overlay.width = W * z;
  overlay.height = H * z;
  overlay.style.width = (W * z) + "px";
  overlay.style.height = (H * z) + "px";

  const g = octx;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0, 0, overlay.width, overlay.height);

  if (state.toggles.grid) {
    g.lineWidth = 1;
    if (z >= 8) {
      g.strokeStyle = "rgba(140,175,215,0.055)";
      g.beginPath();
      for (let x = 0; x <= W; x++) { g.moveTo(x*z + .5, 0); g.lineTo(x*z + .5, H*z); }
      for (let y = 0; y <= H; y++) { g.moveTo(0, y*z + .5); g.lineTo(W*z, y*z + .5); }
      g.stroke();
    }
    g.strokeStyle = "rgba(140,175,215,0.11)";
    g.beginPath();
    for (let x = 0; x <= W; x += 8) { g.moveTo(x*z + .5, 0); g.lineTo(x*z + .5, H*z); }
    for (let y = 0; y <= H; y += 8) { g.moveTo(0, y*z + .5); g.lineTo(W*z, y*z + .5); }
    g.stroke();
  }

  if (state.toggles.guides) {
    g.save();
    g.setLineDash([5, 4]);
    g.lineWidth = 1;

    g.strokeStyle = "rgba(90,215,255,0.55)";
    g.beginPath(); g.moveTo(64*z + .5, 0); g.lineTo(64*z + .5, H*z); g.stroke();

    g.strokeStyle = "rgba(255,180,84,0.28)";
    g.beginPath();
    for (const y of [6, 18]) { g.moveTo(0, y*z + .5); g.lineTo(W*z, y*z + .5); }
    g.stroke();

    g.strokeStyle = "rgba(89,217,255,0.24)";
    g.beginPath();
    for (const y of [20, 44]) { g.moveTo(0, y*z + .5); g.lineTo(W*z, y*z + .5); }
    g.stroke();

    g.strokeStyle = "rgba(132,255,168,0.26)";
    g.beginPath();
    for (const y of [48, 60]) { g.moveTo(0, y*z + .5); g.lineTo(W*z, y*z + .5); }
    g.stroke();
    g.restore();
  }

  if (state.toggles.boxes) {
    for (const el of state.elements) {
      if (el.visible === false || !el.text) continue;
      const b = geom(el);
      g.strokeStyle = (COLORS[el.role] || "#fff") + "aa";
      g.lineWidth = 1;
      g.strokeRect(b.x*z + .5, b.y*z + .5, Math.max(0, b.w*z - 1), Math.max(0, b.h*z - 1));
    }
  }

  const sel = state.elements.find(e => e.id === state.selected);
  if (sel && sel.visible !== false) {
    const b = geom(sel);
    g.save();
    g.setLineDash([4, 3]);
    g.strokeStyle = "#ffffff";
    g.lineWidth = 2;
    g.strokeRect(b.x*z + 1, b.y*z + 1, Math.max(0, b.w*z - 2), Math.max(0, b.h*z - 2));
    g.restore();
  }
}

// ---- Diagnostics ----------------------------------------------------------
function analyze(){
  const issues = [];
  const vis = state.elements.filter(e => e.visible !== false && e.text);
  const boxes = vis.map(el => ({ el, b: geom(el) }));

  for (const { el, b } of boxes) {
    if (b.x < 0 || b.y < 0 || b.x + b.w > W || b.y + b.h > H) {
      const parts = [];
      if (b.x < 0) parts.push("左越界 " + b.x);
      if (b.y < 0) parts.push("上越界 " + b.y);
      if (b.x + b.w > W) parts.push("右边缘 " + (b.x + b.w) + " > 128");
      if (b.y + b.h > H) parts.push("下边缘 " + (b.y + b.h) + " > 64");
      issues.push({ type:"bad", tag:"越界", id:el.id, text:`${el.name}：${parts.join("，")}` });
    }
    if (!el.fullWidth && b.x < 64 && b.x + b.w > 64) {
      issues.push({ type:"warn", tag:"跨栏", id:el.id,
        text:`${el.name}：右边缘 ${b.x + b.w} 越过 x=64（栏宽 64px）` });
    }
    const fd = fontOf(el);
    if (fd.kind === "ttf") {
      const missing = [...el.text].find(ch => ch.codePointAt(0) >= 0x100);
      if (missing) {
        issues.push({ type:"warn", tag:"缺字", id:el.id,
          text:`${el.name}：${fd.label} 不含中文字形「${missing}」，请改用中文点阵字体` });
      }
    } else {
      for (const ch of el.text) {
        const cp = ch.codePointAt(0);
        if (cp >= 0x100 && !CJK[cp]) {
          issues.push({ type:"warn", tag:"缺字", id:el.id,
            text:`${el.name}：字体缺少字形「${ch}」U+${cp.toString(16).toUpperCase()}` });
          break;
        }
      }
    }
  }

  for (let i = 0; i < boxes.length; i++) {
    for (let j = i + 1; j < boxes.length; j++) {
      const A = boxes[i], B = boxes[j];
      const a0 = A.b.x, a1 = A.b.x + A.b.w - 1, b0 = A.b.y, b1 = A.b.y + A.b.h - 1;
      const c0 = B.b.x, c1 = B.b.x + B.b.w - 1, d0 = B.b.y, d1 = B.b.y + B.b.h - 1;
      if (a0 <= c1 && c0 <= a1 && b0 <= d1 && d0 <= b1) {
        issues.push({ type:"bad", tag:"重叠", id:A.el.id,
          text:`${A.el.name} ↔ ${B.el.name}（框重叠）` });
      }
    }
  }
  return issues;
}

function renderDiagnostics(issues){
  const list = $("diagList");
  const badge = $("diagBadge");
  const bad = issues.filter(i => i.type === "bad").length;
  const warn = issues.length - bad;

  badge.className = "badge " + (bad ? "err" : warn ? "warn" : "ok");
  badge.textContent = bad ? `${bad} 处越界/重叠` : warn ? `${warn} 处提醒` : "无冲突";

  list.innerHTML = "";
  if (!issues.length) {
    const li = document.createElement("li");
    li.className = "ok-line";
    li.textContent = "所有可见元素都在屏幕内，且互不重叠。";
    list.appendChild(li);
    return;
  }
  for (const it of issues) {
    const li = document.createElement("li");
    li.dataset.id = it.id;
    const tag = document.createElement("span");
    tag.className = "tag " + it.type;
    tag.textContent = it.tag;
    const txt = document.createElement("span");
    txt.textContent = it.text;
    li.append(tag, txt);
    li.addEventListener("click", () => selectElement(it.id));
    list.appendChild(li);
  }
}

// ---- Layer list -----------------------------------------------------------
function renderLayers(){
  const wrap = $("layerList");
  const scroll = wrap.scrollTop;
  wrap.innerHTML = "";
  for (const el of state.elements) {
    const li = document.createElement("li");
    li.className = "layer" + (el.id === state.selected ? " sel" : "") + (el.visible === false ? " hidden" : "");
    li.dataset.id = el.id;
    li.title = el.name + " · " + (FONT_DEFS[el.font] ? FONT_DEFS[el.font].label : el.font);

    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = COLORS[el.role] || "#fff";

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = el.name + " · " + el.text;

    const pos = document.createElement("span");
    pos.className = "pos";
    const b = geom(el);
    pos.textContent = `${b.x},${el.y}`;

    const eye = document.createElement("button");
    eye.className = "eye";
    eye.title = el.visible === false ? "显示" : "隐藏";
    eye.textContent = el.visible === false ? "○" : "●";
    eye.addEventListener("click", (ev) => {
      ev.stopPropagation();
      el.visible = el.visible === false;
      renderAll();
      refreshInspector();
    });

    li.append(dot, nm, pos, eye);
    li.addEventListener("click", () => selectElement(el.id));
    wrap.appendChild(li);
  }
  $("layerCount").textContent = state.elements.length + " 项";
  wrap.scrollTop = scroll;
}

// ---- Inspector ------------------------------------------------------------
function selectElement(id){
  state.selected = id;
  buildInspector();
  renderAll();
}

function buildInspector(){
  const host = $("inspector");
  const el = state.elements.find(e => e.id === state.selected);
  if (!el) {
    host.innerHTML = '<div class="insp-empty">在画布或图层列表中选择一个元素。</div>';
    return;
  }
  const fontOpts = FONT_GROUPS.map(group =>
    `<optgroup label="${group.label}">` +
    group.ids.map(k => `<option value="${k}"${k === el.font ? " selected" : ""}>${FONT_DEFS[k].label}</option>`).join("") +
    `</optgroup>`).join("");
  const alignOpts = Object.entries(ALIGN_LABEL).map(([k, v]) =>
    `<option value="${k}"${k === el.align ? " selected" : ""}>${v}</option>`).join("");

  host.innerHTML = `
    <div class="field wide"><label>文本</label><input id="inspText" type="text" value="${escapeAttr(el.text)}"></div>
    <div class="row2">
      <div class="field"><label>字体</label><select id="inspFont">${fontOpts}</select></div>
      <div class="field"><label>对齐</label><select id="inspAlign">${alignOpts}</select></div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div class="field"><label id="anchorLabel">X 锚点</label><input id="inspX" type="number" step="1" value="${el.anchor}"></div>
      <div class="field"><label>Y 顶边</label><input id="inspY" type="number" step="1" value="${el.y}"></div>
    </div>
    <label class="check"><input id="inspVisible" type="checkbox"${el.visible === false ? "" : " checked"}> 显示该元素</label>
    <div class="readout" id="inspReadout"></div>
  `;

  const text = $("inspText");
  text.addEventListener("input", () => {
    el.text = text.value;
    if (el.bind) el.bind = null; // manual edit detaches from sensor data
    updateReadout();
    renderAll(true);
  });

  $("inspFont").addEventListener("change", (e) => {
    el.font = e.target.value;
    updateReadout(); renderAll(true);
  });
  $("inspAlign").addEventListener("change", (e) => {
    const b = geom(el);
    if (e.target.value === "left") el.anchor = b.x;
    else if (e.target.value === "center") el.anchor = b.x + Math.floor(b.w / 2);
    else el.anchor = b.x + b.w;
    el.align = e.target.value;
    buildInspector(); renderAll(true);
  });
  $("inspX").addEventListener("input", (e) => {
    const v = parseInt(e.target.value, 10);
    if (!Number.isNaN(v)) { el.anchor = v; updateReadout(); renderAll(true); }
  });
  $("inspY").addEventListener("input", (e) => {
    const v = parseInt(e.target.value, 10);
    if (!Number.isNaN(v)) { el.y = v; updateReadout(); renderAll(true); }
  });
  $("inspVisible").addEventListener("change", (e) => {
    el.visible = e.target.checked;
    renderAll(true);
  });

  updateReadout();
}

function refreshInspector(){
  const el = state.elements.find(e => e.id === state.selected);
  if (!el) { buildInspector(); return; }
  const t = $("inspText"); if (t && document.activeElement !== t) t.value = el.text;
  const fx = $("inspX"); if (fx && document.activeElement !== fx) fx.value = el.anchor;
  const fy = $("inspY"); if (fy && document.activeElement !== fy) fy.value = el.y;
  updateReadout();
}

function updateReadout(){
  const el = state.elements.find(e => e.id === state.selected);
  const host = $("inspReadout");
  if (!el || !host) return;
  const b = geom(el);
  const label = $("anchorLabel");
  if (label) label.textContent = el.align === "left" ? "X 左边缘" : el.align === "center" ? "X 中心" : "X 右边缘";
  host.innerHTML =
    `字体 <b>${fontOf(el).label}</b><br>` +
    `实际位置 <b>x=${b.x}</b> y=${b.y}<br>` +
    `文字宽高 <b>${b.w}×${b.h}</b> px<br>` +
    `右边缘 <b>${b.x + b.w}</b> · 下边缘 <b>${b.y + b.h}</b>`;
}

// ---- Render orchestration -------------------------------------------------
function renderAll(keepInspector){
  drawScreen();
  drawOverlay();
  renderLayers();
  renderDiagnostics(analyze());
  if (!keepInspector) refreshInspector(); else updateReadout();
  updateExport();
}

function updateExport(){
  const payload = {
    screen: { w: W, h: H },
    page: state.page,
    valueAdvance: 6 * state.metric,
    data: state.data,
    elements: state.elements.map(el => {
      const b = geom(el);
      return {
        id: el.id, name: el.name, text: el.text, font: el.font,
        align: el.align, anchor: el.anchor, x: b.x, y: el.y,
        w: b.w, h: b.h, visible: el.visible !== false,
      };
    }),
  };
  $("exportPreview").textContent = JSON.stringify(payload, null, 2);
  return payload;
}

// ---- Rulers / zoom --------------------------------------------------------
function buildRulers(){
  const z = state.zoom;
  const rx = $("rulerX"), ry = $("rulerY");
  rx.style.width = (W * z) + "px";
  ry.style.height = (H * z) + "px";
  rx.innerHTML = ""; ry.innerHTML = "";
  for (let x = 0; x <= W; x += 8) {
    const s = document.createElement("span");
    const major = x % 16 === 0;
    s.className = "tick" + (major ? " major" : "") + (x === 64 ? " mark" : "");
    s.style.left = (x * z) + "px";
    if (major) s.textContent = x;
    rx.appendChild(s);
  }
  for (let y = 0; y <= H; y += 8) {
    const s = document.createElement("span");
    const major = y % 16 === 0;
    s.className = "tick" + (major ? " major" : "") + (y === 64 ? " mark" : "");
    s.style.top = (y * z) + "px";
    if (major) s.textContent = y;
    ry.appendChild(s);
  }
}

function setZoom(z){
  state.zoom = Math.max(3, Math.min(12, z));
  zoomLabel.textContent = state.zoom + "×";
  screenCv.style.width = (W * state.zoom) + "px";
  screenCv.style.height = (H * state.zoom) + "px";
  buildRulers();
  drawOverlay();
}

// ---- Page / data ----------------------------------------------------------
const PAGES = { climate:"温湿度", air:"空气质量" };

function buildTabs(){
  const host = $("pageTabs");
  host.innerHTML = "";
  for (const [key, name] of Object.entries(PAGES)) {
    const b = document.createElement("button");
    b.className = "tab" + (key === state.page ? " active" : "");
    b.textContent = name;
    b.addEventListener("click", () => {
      if (state.page === key) return;
      state.page = key;
      state.selected = null;
      state.elements = cache[key];
      syncTexts();
      buildTabs();
      buildInspector();
      renderAll();
    });
    host.appendChild(b);
  }
}

function bindDataInputs(){
  const map = [
    ["dataT", "t", 0.1],
    ["dataH", "h", 1],
    ["dataEco2", "eco2", 1],
    ["dataTvoc", "tvoc", 1],
    ["dataAqi", "aqi", 1],
  ];
  for (const [id, key, step] of map) {
    const input = $(id);
    input.addEventListener("input", () => {
      const v = parseFloat(input.value);
      if (Number.isNaN(v)) return;
      state.data[key] = Math.round(v / step) * step;
      syncTexts();
      renderAll(true);
    });
  }
  $("btnTypical").addEventListener("click", () => setData({ t:23.4, h:55, eco2:1742, tvoc:1187, aqi:4 }));
  $("btnWorst").addEventListener("click", () => setData({ t:-45.5, h:100, eco2:65535, tvoc:65535, aqi:5 }));
}

function setData(d){
  state.data = { ...d };
  $("dataT").value = d.t;
  $("dataH").value = d.h;
  $("dataEco2").value = d.eco2;
  $("dataTvoc").value = d.tvoc;
  $("dataAqi").value = d.aqi;
  syncTexts();
  renderAll(true);
}

// ---- Pointer interaction --------------------------------------------------
let drag = null;

function eventPoint(e){
  const r = screenCv.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left) * W / r.width),
    y: Math.floor((e.clientY - r.top) * H / r.height),
  };
}

screenCv.addEventListener("pointermove", (e) => {
  const p = eventPoint(e);
  $("coord").textContent = `x ${p.x} · y ${p.y}`;
  if (!drag) return;
  const r = screenCv.getBoundingClientRect();
  const dx = Math.round((e.clientX - drag.startX) * W / r.width);
  const dy = Math.round((e.clientY - drag.startY) * H / r.height);
  drag.el.anchor = drag.anchor0 + dx;
  drag.el.y = drag.y0 + dy;
  refreshInspector();
  renderAll(true);
});

screenCv.addEventListener("pointerdown", (e) => {
  const p = eventPoint(e);
  const hit = [...state.elements].reverse().find(el => {
    if (el.visible === false || !el.text) return false;
    const b = geom(el);
    return p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h;
  });
  if (!hit) { state.selected = null; buildInspector(); renderAll(); return; }
  state.selected = hit.id;
  buildInspector();
  drag = { el: hit, startX: e.clientX, startY: e.clientY, anchor0: hit.anchor, y0: hit.y };
  screenCv.setPointerCapture(e.pointerId);
  renderAll(true);
});

screenCv.addEventListener("pointerup", () => { drag = null; });
screenCv.addEventListener("pointercancel", () => { drag = null; });
screenCv.addEventListener("pointerleave", () => {
  if (!drag) $("coord").textContent = "x – · y –";
});

window.addEventListener("keydown", (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  const el = state.elements.find(x => x.id === state.selected);
  if (!el) return;
  const step = e.shiftKey ? 5 : 1;
  let used = true;
  switch (e.key) {
    case "ArrowLeft":  el.anchor -= step; break;
    case "ArrowRight": el.anchor += step; break;
    case "ArrowUp":    el.y -= step; break;
    case "ArrowDown":  el.y += step; break;
    default: used = false;
  }
  if (!used) return;
  e.preventDefault();
  refreshInspector();
  renderAll(true);
});

// ---- Toolbar --------------------------------------------------------------
function bindToolbar(){
  document.querySelectorAll("[data-toggle]").forEach(btn => {
    const key = btn.dataset.toggle;
    btn.classList.toggle("on", !!state.toggles[key]);
    btn.addEventListener("click", () => {
      state.toggles[key] = !state.toggles[key];
      btn.classList.toggle("on", state.toggles[key]);
      renderAll(true);
    });
  });

  $("zoomOut").addEventListener("click", () => setZoom(state.zoom - 1));
  $("zoomIn").addEventListener("click", () => setZoom(state.zoom + 1));

  $("valueMetric").addEventListener("change", (e) => {
    state.metric = parseInt(e.target.value, 10) === 3 ? 3 : 2;
    updateReadout();
    renderAll(true);
  });

  $("btnReset").addEventListener("click", () => {
    cache[state.page] = defaults(state.page);
    state.elements = cache[state.page];
    state.selected = null;
    syncTexts();
    buildInspector();
    renderAll();
    toast("已恢复当前页的代码布局");
  });

  $("btnPng").addEventListener("click", () => {
    const out = document.createElement("canvas");
    out.width = W * 6; out.height = H * 6;
    const c = out.getContext("2d");
    c.imageSmoothingEnabled = false;
    c.fillStyle = "#000";
    c.fillRect(0, 0, out.width, out.height);
    c.drawImage(screenCv, 0, 0, out.width, out.height);
    const a = document.createElement("a");
    a.download = `oled-128x64-${state.page}.png`;
    a.href = out.toDataURL("image/png");
    a.click();
    toast("PNG 已导出（768×384）");
  });

  $("btnCopy").addEventListener("click", async () => {
    const text = JSON.stringify(updateExport(), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      toast("布局 JSON 已复制");
    } catch (_) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("布局 JSON 已复制");
    }
  });
}

// ---- Misc -----------------------------------------------------------------
function escapeAttr(s){
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

let toastTimer = 0;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

// ---- Boot -----------------------------------------------------------------
function boot(){
  cache.climate = defaults("climate");
  cache.air = defaults("air");
  state.elements = cache.climate;
  syncTexts();

  state.zoom = Math.max(3, Math.min(6, Math.floor((window.innerWidth - 700) / 128)));
  zoomLabel.textContent = state.zoom + "×";
  screenCv.style.width = (W * state.zoom) + "px";
  screenCv.style.height = (H * state.zoom) + "px";

  buildTabs();
  bindDataInputs();
  bindToolbar();
  buildRulers();
  buildInspector();
  renderAll();
}

// Embedded TTF faces must be ready before measuring text, otherwise the first
// paint falls back to a different font and the layout numbers are wrong.
Promise.all([
  document.fonts.load('8px "PressStart2P"'),
  document.fonts.load('16px "PressStart2P"'),
  document.fonts.load('12px "RobotoMono"'),
  document.fonts.load('16px "RobotoMono"'),
  document.fonts.load('20px "RobotoMono"'),
  document.fonts.load('24px "RobotoMono"'),
]).then(boot, boot);

})();
</script>
</body>

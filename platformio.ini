; PlatformIO Project Configuration File
;
; Project: 室内空气质量监测仪（ESP32-C3 + ENS160 + AHT30 + OLED）
; Author:  EndTheme
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSSD1306_128_64
    ; NOTE: Adafruit_SSD1306.h defaults to SSD1306_128_32 which makes
    ; init/comPins/buffer behave like a 32-row panel. We have a 128x64 OLED,
    ; so override that deprecated macro here.
lib_deps =
    https://github.com/sparkfun/SparkFun_Indoor_Air_Quality_Sensor-ENS160_Arduino_Library/archive/refs/tags/v1.1.0.zip
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.17